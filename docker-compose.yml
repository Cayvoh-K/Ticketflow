version: "3.9"

services:

  postgres:
    image: postgres:16-alpine

    container_name: ticketflow-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD: ticketflow123
      POSTGRES_DB: ticketflow

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api

    container_name: ticketflow-api

    restart: unless-stopped

    ports:
      - "3001:3001"

    env_file:
      - ./apps/api/.env

    depends_on:
      - postgres

volumes:
  postgres_data: